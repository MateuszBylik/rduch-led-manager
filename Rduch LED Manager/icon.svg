<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 120" width="512" height="512">
  <rect width="90" height="120" rx="10" fill="#111111" stroke="#000000" stroke-width="2"/>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="#222222">
    <circle cx="75" cy="15" r="4.5"/>
    <circle cx="30" cy="30" r="4.5"/><circle cx="45" cy="30" r="4.5"/><circle cx="60" cy="30" r="4.5"/>
    <circle cx="30" cy="45" r="4.5"/><circle cx="45" cy="45" r="4.5"/><circle cx="60" cy="45" r="4.5"/>
    <circle cx="75" cy="60" r="4.5"/>
    <circle cx="30" cy="75" r="4.5"/><circle cx="60" cy="75" r="4.5"/><circle cx="75" cy="75" r="4.5"/>
    <circle cx="30" cy="90" r="4.5"/><circle cx="45" cy="90" r="4.5"/><circle cx="75" cy="90" r="4.5"/>
    <circle cx="30" cy="105" r="4.5"/><circle cx="45" cy="105" r="4.5"/><circle cx="60" cy="105" r="4.5"/>
  </g>

  <g fill="#ffaa00" filter="url(#glow)">
    <circle cx="15" cy="15" r="4.5"/><circle cx="30" cy="15" r="4.5"/><circle cx="45" cy="15" r="4.5"/><circle cx="60" cy="15" r="4.5"/>
    <circle cx="15" cy="30" r="4.5"/><circle cx="75" cy="30" r="4.5"/>
    <circle cx="15" cy="45" r="4.5"/><circle cx="75" cy="45" r="4.5"/>
    <circle cx="15" cy="60" r="4.5"/><circle cx="30" cy="60" r="4.5"/><circle cx="45" cy="60" r="4.5"/><circle cx="60" cy="60" r="4.5"/>
    <circle cx="15" cy="75" r="4.5"/><circle cx="45" cy="75" r="4.5"/>
    <circle cx="15" cy="90" r="4.5"/><circle cx="60" cy="90" r="4.5"/>
    <circle cx="15" cy="105" r="4.5"/><circle cx="75" cy="105" r="4.5"/>
  </g>
</svg>
