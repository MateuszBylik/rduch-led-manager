<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rduch LED</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <div data-tauri-drag-region class="titlebar">
    <div class="titlebar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 120" width="100%" height="100%">
        <rect width="90" height="120" rx="15" fill="#111" stroke="#000" stroke-width="4" />
        <g fill="#ffaa00">
          <circle cx="15" cy="15" r="5" />
          <circle cx="30" cy="15" r="5" />
          <circle cx="45" cy="15" r="5" />
          <circle cx="60" cy="15" r="5" />
          <circle cx="15" cy="30" r="5" />
          <circle cx="75" cy="30" r="5" />
          <circle cx="15" cy="45" r="5" />
          <circle cx="75" cy="45" r="5" />
          <circle cx="15" cy="60" r="5" />
          <circle cx="30" cy="60" r="5" />
          <circle cx="45" cy="60" r="5" />
          <circle cx="60" cy="60" r="5" />
          <circle cx="15" cy="75" r="5" />
          <circle cx="45" cy="75" r="5" />
          <circle cx="15" cy="90" r="5" />
          <circle cx="60" cy="90" r="5" />
          <circle cx="15" cy="105" r="5" />
          <circle cx="75" cy="105" r="5" />
        </g>
      </svg>
    </div>
  
    <div data-tauri-drag-region class="titlebar-title">Rduch LED</div>
  
    <div class="titlebar-buttons">
      <div class="titlebar-btn" id="titlebar-minimize"></div>
      <div class="titlebar-btn" id="titlebar-maximize"></div>
      <div class="titlebar-btn" id="titlebar-close"></div>
    </div>
  </div>

  <div class="app-container">
    <aside class="panel library-panel">
      <h2>Biblioteka Pieśni</h2>
      <div class="drive-selector-container">
        <button id="loadSdBtn" class="primary-btn reactive-btn">
          <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
            <path d="M16 18h.01"></path>
            <path d="M4 8h16"></path>
            <path d="M4 12h16"></path>
          </svg>
          <span id="loadSdBtnText">Wybierz kartę pamięci...</span>
        </button>
      
        <div id="driveList" class="drive-list" style="display: none;">
        </div>
      </div>
    
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Szukaj pieśni...">
        <button id="clearSearchBtn" class="clear-btn" style="display: none;" title="Wyczyść">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    
      <div id="errorBox"
        style="display: none; background: #ff555544; border: 1px solid #ff5555; padding: 10px; margin: 10px 0; border-radius: 4px;">
        <h3 style="color: #ff5555; font-size: 1rem; margin-bottom: 5px;">⚠️ Znaleziono problemy:</h3>
        <ul id="errorList" style="list-style: none; color: #ff9999; font-size: 0.85rem; margin-bottom: 10px;"></ul>
        <button id="openExplorerBtn" class="primary-btn" style="width: 100%; font-size: 0.85rem;">Otwórz lokalizację
          plików</button>
      </div>
    
      <div id="libraryTree" style="flex-grow: 1; overflow-y: auto; margin-top: 10px;">
      </div>
    </aside>
    
    <main class="panel tabs-panel" style="flex: 2; display: flex; flex-direction: column; padding: 0; overflow: hidden;">
      <div class="tabs-header">
        <button class="tab-btn active" id="tabPreview">Podgląd</button>
        <button class="tab-btn" id="tabLists">Listy</button>
      </div>
    
      <div class="tabs-content">
        <div id="viewPreview" class="tab-view active">
    
          <div class="preview-header">
            <div class="preview-title-block">
              <span class="preview-number" id="previewNumber">#----</span>
              <span class="preview-song-title" id="previewSongTitle">Wybierz pieśń z listy po lewej</span>
            </div>
            <button id="btnEdit" class="secondary-btn icon-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              Edytuj
            </button>
          </div>
    
          <div class="preview-layout">
            <div class="preview-sequence" id="previewSequence">
              <div style="padding: 20px; color: #666; text-align: center;">Brak wczytanej sekwencji</div>
            </div>
    
            <div class="preview-matrix-area">
              <div class="rduch-simulator-wrapper" style="margin: 0 auto;">
                <canvas id="rduchCanvas"></canvas>
              </div>
    
              <div class="preview-controls">
                <button id="btnPrevScreen" class="secondary-btn icon-btn" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                  Poprzedni
                </button>
                <span id="screenCounter"
                  style="color: #888; font-size: 0.9rem; font-weight: bold; min-width: 60px; text-align: center;">0 /
                  0</span>
                <button id="btnNextScreen" class="secondary-btn icon-btn" disabled>
                  Następny
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
    
        </div>
    
        <div id="viewLists" class="tab-view" style="display: none; padding: 20px;">
          <h3>Zarządzanie listami (wkrótce)</h3>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
